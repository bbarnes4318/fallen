name: HQ Phase 2E Validation Policy Experiment

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run ID of the HQ Phase 3A Validation to source validation_results.jsonl from (e.g., 25645218529)'
        required: true
        default: '25645218529'

jobs:
  phase2e-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Download Phase 3A Validation Artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download ${{ github.event.inputs.source_run_id }} -p "validation-results-*" --dir downloaded_results/

      - name: Verify Extracted Output
        run: ls -la downloaded_results/*/

      - name: Run Phase 2E Validation Experiment
        run: |
          mkdir hq_phase2e_validation_policy_results
          JSONL_FILE=$(find downloaded_results -name "validation_results.jsonl" | head -n 1)
          python scripts/generate_hq_phase2e_validation.py \
            --input-jsonl "$JSONL_FILE" \
            --manifest validation/validation_pairs_hq_headshots.csv \
            --output-dir hq_phase2e_validation_policy_results

      - name: Upload Phase 2E Results
        uses: actions/upload-artifact@v4
        with:
          name: hq_phase2e_validation_policy_results
          path: hq_phase2e_validation_policy_results/
