name: HQ Visual Audit

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the validation pipeline to use for the audit (e.g. 25645218529)'
        required: true
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install Pillow

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Validation Artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download ${{ inputs.run_id }} -D ./downloaded_artifacts || echo "Fallback: continuing to search"
          find ./downloaded_artifacts -name "validation_results.jsonl" -exec cp {} validation_results.jsonl \;
          if [ ! -f validation_results.jsonl ]; then
            echo "ERROR: validation_results.jsonl not found in artifact"
            exit 1
          fi

      - name: Run Grid Sweep
        run: |
          python scripts/sweep_hq_calibration.py --input validation_results.jsonl --output-dir hq_visual_audit

      - name: Generate Phase 2D Contact Sheets
        run: |
          python scripts/generate_hq_phase2d_visual_audit.py --input validation_results.jsonl --output-dir hq_visual_audit/phase2d_contact_sheets

      - name: Generate Phase 2D Markdown Report
        run: |
          cat << 'EOF' > hq_visual_audit/phase2d_contact_sheets/hq_phase2d_visual_audit_report.md
          # HQ Phase 2D Visual Audit Report
          
          This artifact contains the Phase 2D visual audit generated from the validation results.
          
          ## Evidence
          - Contact Sheets (Paired crops for Light Scar and Dark Spot)
          - Clean Evidence Cards (512x512 and 768x768)
          - Crop Tiles (256x256, 512x512, 768x768)
          - Correspondence Overlays
          - `hq_phase2d_visual_review_sheet.csv`
          - `hq_phase2d_clean_visual_review_sheet.csv`
          - `hq_phase2d_visual_audit_debug_summary.csv`
          - `hq_phase2d_clean_visual_debug_summary.csv`
          EOF

      - name: Upload Phase 2D Visual Audit Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hq_phase2d_clean_visual_audit_evidence
          path: hq_visual_audit/phase2d_contact_sheets/
