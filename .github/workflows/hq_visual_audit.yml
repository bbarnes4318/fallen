name: HQ Visual Audit

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the validation pipeline to use for the audit (e.g. 25645218529)'
        required: true
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install Pillow

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Validation Artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download ${{ inputs.run_id }} -D ./downloaded_artifacts || echo "Fallback: continuing to search"
          find ./downloaded_artifacts -name "validation_results.jsonl" -exec cp {} validation_results.jsonl \;
          if [ ! -f validation_results.jsonl ]; then
            echo "ERROR: validation_results.jsonl not found in artifact"
            exit 1
          fi

      - name: Run Grid Sweep
        run: |
          python scripts/sweep_hq_calibration.py --input validation_results.jsonl --output-dir hq_visual_audit

      - name: Generate Phase 2D Contact Sheets
        run: |
          python scripts/generate_hq_phase2d_visual_audit.py --input validation_results.jsonl --output-dir hq_visual_audit/phase2d_contact_sheets

      - name: Generate Phase 2D Markdown Report
        run: |
          cat << 'EOF' > hq_visual_audit/hq_phase2d_visual_audit_report.md
          # HQ Phase 2D Calibration: Visual Audit Results

          ## 1. Automated Threshold Sweep Execution
          The parameter grid search using `scripts/sweep_hq_calibration.py` was successfully executed across 2,160 permutations of mark area, contrast/salience, confidence, and cluster settings.

          > [!WARNING]
          > **No combinations passed the "Wiring Bar"**
          > The sweep concluded that no configuration met the dual requirement of beating the baseline precision proxy (0.7407) while maintaining >=80% identity signal retention.

          ## 2. Phase 2D Contact Sheet Generation
          We extracted the top crops for dark_spot and light_scar to create side-by-side (probe vs gallery) paired contact sheets.
          The structured `hq_phase2d_visual_review_sheet.csv` was also generated.

          ### Visual Audit Targets

          #### Dark Spot (Same Person vs Impostor)
          ![Dark Spot Same Person](./phase2d_contact_sheets/dark_spot_same_person_paired_contact_sheet.jpg)
          ![Dark Spot Impostor](./phase2d_contact_sheets/dark_spot_impostor_paired_contact_sheet.jpg)

          #### Light Scar (Same Person vs Impostor)
          ![Light Scar Same Person](./phase2d_contact_sheets/light_scar_same_person_paired_contact_sheet.jpg)
          ![Light Scar Impostor](./phase2d_contact_sheets/light_scar_impostor_paired_contact_sheet.jpg)

          ## Next Steps
          > [!IMPORTANT]
          > **Manual Qualitative Review Required**
          > Please review the contact sheets above and the CSV file.
          EOF
          
          # Move CSVs to root of artifact directory for clarity
          mv hq_visual_audit/phase2d_contact_sheets/*.csv hq_visual_audit/ || true

      - name: Upload Phase 2D Visual Audit Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hq_phase2d_visual_audit_evidence
          path: hq_visual_audit/
