name: Biometric Validation Framework

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: 'Path to validation_pairs.csv (for dry-run, full-pipeline, embeddings-only)'
        required: false
        default: 'validation/validation_pairs.example.csv'
      mode:
        description: 'Execution mode'
        required: true
        type: choice
        options:
          - dry-run
          - full-pipeline
          - full-pipeline-sharded
          - embeddings-only
          - generate-manifest
          - generate-and-validate-lfw
        default: 'dry-run'
      lfw_pairs_source:
        description: 'Which LFW pairs file to use (for generate-manifest and generate-and-validate-lfw)'
        required: true
        type: choice
        options:
          - full
          - dev-train
          - dev-test
        default: 'full'
      manifest_max_matched:
        description: 'Max matched (same-person) pairs. 0 = unlimited.'
        required: false
        default: '0'
      manifest_max_mismatched:
        description: 'Max mismatched (different-person) pairs. 0 = unlimited.'
        required: false
        default: '0'
      manifest_check_gcs:
        description: 'Verify GCS blob existence during manifest generation'
        required: false
        type: boolean
        default: true
      manifest_fail_on_missing:
        description: 'Fail workflow if any selected LFW image is missing from GCS'
        required: false
        type: boolean
        default: true
      validation_shard_count:
        description: 'Number of parallel validation shards'
        required: false
        default: '1'
      strict_mark_matcher:
        description: 'Enable experimental strict V2 mark matcher'
        required: false
        type: boolean
        default: false
      hq_mark_calibration:
        description: 'Enable validation-only HQ Phase 1 mark detector calibration'
        required: false
        type: boolean
        default: false

jobs:
  validate:
    if: inputs.mode != 'full-pipeline-sharded'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate Run ID
        id: run_id
        run: echo "id=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT

      - name: Resolve LFW Pairs File
        id: lfw_pairs
        run: |
          case "${{ inputs.lfw_pairs_source }}" in
            full)      PAIRS_FILE="validation/lfw_pairs.txt" ;;
            dev-train) PAIRS_FILE="validation/lfw_pairsDevTrain.txt" ;;
            dev-test)  PAIRS_FILE="validation/lfw_pairsDevTest.txt" ;;
            *)         PAIRS_FILE="validation/lfw_pairs.txt" ;;
          esac
          echo "file=$PAIRS_FILE" >> $GITHUB_OUTPUT
          if [ -f "$PAIRS_FILE" ]; then
            LINES=$(wc -l < "$PAIRS_FILE")
            echo "LFW pairs file: $PAIRS_FILE ($LINES lines)"
          else
            echo "ERROR: LFW pairs file not found: $PAIRS_FILE"
            exit 1
          fi

      # ── GCP Authentication ──
      # Required for: generate-manifest (with GCS check), generate-and-validate-lfw, full-pipeline, embeddings-only
      - name: Authenticate to GCP
        if: >-
          inputs.mode == 'full-pipeline' ||
          inputs.mode == 'embeddings-only' ||
          inputs.mode == 'generate-and-validate-lfw' ||
          (inputs.mode == 'generate-manifest' && inputs.manifest_check_gcs)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}

      # ═══════════════════════════════════════════════════════
      # MODE: dry-run
      # ═══════════════════════════════════════════════════════
      - name: Dry Run — Validate Manifest
        if: inputs.mode == 'dry-run'
        run: |
          python scripts/validate_full_pipeline.py \
            --manifest ${{ inputs.manifest_path }} \
            --output-dir validation/results/${{ steps.run_id.outputs.id }} \
            --dry-run

      # ═══════════════════════════════════════════════════════
      # MODE: generate-manifest
      # ═══════════════════════════════════════════════════════
      - name: Generate LFW Manifest
        if: inputs.mode == 'generate-manifest'
        run: |
          FLAGS=""
          if [ "${{ inputs.manifest_check_gcs }}" = "true" ]; then
            FLAGS="$FLAGS --check-gcs-exists"
          fi
          if [ "${{ inputs.manifest_fail_on_missing }}" = "true" ]; then
            FLAGS="$FLAGS --fail-on-missing"
          fi
          python scripts/generate_lfw_validation_manifest.py \
            --pairs-file "${{ steps.lfw_pairs.outputs.file }}" \
            --gcs-prefix gs://hoppwhistle-facial-uploads/gallery/ \
            --output validation/results/${{ steps.run_id.outputs.id }}/validation_pairs_lfw_baseline.csv \
            --max-matched ${{ inputs.manifest_max_matched }} \
            --max-mismatched ${{ inputs.manifest_max_mismatched }} \
            $FLAGS

      # ═══════════════════════════════════════════════════════
      # MODE: generate-and-validate-lfw
      # ═══════════════════════════════════════════════════════
      - name: Generate LFW Manifest (for validation)
        if: inputs.mode == 'generate-and-validate-lfw'
        run: |
          python scripts/generate_lfw_validation_manifest.py \
            --pairs-file "${{ steps.lfw_pairs.outputs.file }}" \
            --gcs-prefix gs://hoppwhistle-facial-uploads/gallery/ \
            --output validation/results/${{ steps.run_id.outputs.id }}/validation_pairs_lfw_baseline.csv \
            --max-matched ${{ inputs.manifest_max_matched }} \
            --max-mismatched ${{ inputs.manifest_max_mismatched }} \
            --check-gcs-exists \
            --fail-on-missing

      - name: Run Full Pipeline Validation (LFW)
        if: inputs.mode == 'generate-and-validate-lfw'
        env:
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          KMS_KEY_ID: ${{ secrets.KMS_KEY_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
          USE_MARK_PIPELINE_V2: "true"
          USE_STRICT_MARK_MATCHER_V2: ${{ inputs.strict_mark_matcher && 'true' || 'false' }}
        run: |
          python scripts/validate_full_pipeline.py \
            --manifest validation/results/${{ steps.run_id.outputs.id }}/validation_pairs_lfw_baseline.csv \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}

      - name: Simulate Decision Policies (LFW)
        if: inputs.mode == 'generate-and-validate-lfw'
        run: |
          python scripts/simulate_decision_policies.py \
            --input validation/results/${{ steps.run_id.outputs.id }}/validation_results.jsonl \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}/policies

      - name: Evaluate Mark LR Correlation (LFW)
        if: inputs.mode == 'generate-and-validate-lfw'
        run: |
          python scripts/evaluate_mark_lr_correlation.py \
            --input validation/results/${{ steps.run_id.outputs.id }}/validation_results.jsonl \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}/mark_analysis

      # ═══════════════════════════════════════════════════════
      # MODE: full-pipeline (with user-provided manifest)
      # ═══════════════════════════════════════════════════════
      - name: Full Pipeline Validation
        if: inputs.mode == 'full-pipeline'
        env:
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          KMS_KEY_ID: ${{ secrets.KMS_KEY_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
          USE_MARK_PIPELINE_V2: "true"
          USE_STRICT_MARK_MATCHER_V2: ${{ inputs.strict_mark_matcher && 'true' || 'false' }}
        run: |
          echo "WARNING: Full pipeline validation. This will process real images."
          python scripts/validate_full_pipeline.py \
            --manifest ${{ inputs.manifest_path }} \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}

      # ═══════════════════════════════════════════════════════
      # MODE: embeddings-only
      # ═══════════════════════════════════════════════════════
      - name: Embeddings-Only Validation
        if: inputs.mode == 'embeddings-only'
        env:
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          KMS_KEY_ID: ${{ secrets.KMS_KEY_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
        run: |
          python scripts/validate_embeddings.py \
            --manifest ${{ inputs.manifest_path }} \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}

      # ═══════════════════════════════════════════════════════
      # Post-processing (full-pipeline mode only)
      # ═══════════════════════════════════════════════════════
      - name: Simulate Decision Policies
        if: inputs.mode == 'full-pipeline'
        run: |
          python scripts/simulate_decision_policies.py \
            --input validation/results/${{ steps.run_id.outputs.id }}/validation_results.jsonl \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}/policies

      - name: Evaluate Mark LR Correlation
        if: inputs.mode == 'full-pipeline'
        run: |
          python scripts/evaluate_mark_lr_correlation.py \
            --input validation/results/${{ steps.run_id.outputs.id }}/validation_results.jsonl \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}/mark_analysis

      # ═══════════════════════════════════════════════════════
      # Upload all artifacts
      # ═══════════════════════════════════════════════════════
      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results-${{ steps.run_id.outputs.id }}
          path: validation/results/${{ steps.run_id.outputs.id }}/

  setup-shards:
    if: inputs.mode == 'full-pipeline-sharded'
    runs-on: ubuntu-latest
    outputs:
      shard_matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          count="${{ inputs.validation_shard_count }}"
          if [ "$count" -lt 1 ]; then
            echo "ERROR: validation_shard_count must be at least 1."
            exit 1
          fi
          if [ "$count" -gt 10 ]; then
            count=10
            echo "WARNING: Capping validation_shard_count to 10."
          fi
          matrix=$(seq 0 $((count-1)) | jq -R . | jq -s -c .)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  validate-sharded:
    needs: setup-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: ${{ fromJSON(needs.setup-shards.outputs.shard_matrix) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate Run ID
        id: run_id
        run: echo "id=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}

      - name: Full Pipeline Validation Shard
        env:
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          KMS_KEY_ID: ${{ secrets.KMS_KEY_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
          USE_MARK_PIPELINE_V2: "true"
          USE_STRICT_MARK_MATCHER_V2: ${{ inputs.strict_mark_matcher && 'true' || 'false' }}
        run: |
          echo "WARNING: Full pipeline validation sharded. This will process real images."
          python scripts/validate_full_pipeline.py \
            --manifest ${{ inputs.manifest_path }} \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}/shard_${{ matrix.shard_index }} \
            --shard-index ${{ matrix.shard_index }} \
            --shard-count ${{ inputs.validation_shard_count }}

      - name: Upload Shard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-results-${{ steps.run_id.outputs.id }}-shard-${{ matrix.shard_index }}
          path: validation/results/${{ steps.run_id.outputs.id }}/shard_${{ matrix.shard_index }}/

  merge-shards:
    needs: [setup-shards, validate-sharded]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Generate Run ID
        id: run_id
        run: echo "id=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: validation/results/${{ steps.run_id.outputs.id }}/shards/

      - name: Merge validation shards
        run: |
          python scripts/merge_validation_shards.py \
            --input-dir validation/results/${{ steps.run_id.outputs.id }}/shards/ \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}/merged/

      - name: Simulate Decision Policies
        run: |
          python scripts/simulate_decision_policies.py \
            --input validation/results/${{ steps.run_id.outputs.id }}/merged/validation_results.jsonl \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}/merged/policies

      - name: Evaluate Mark LR Correlation
        run: |
          python scripts/evaluate_mark_lr_correlation.py \
            --input validation/results/${{ steps.run_id.outputs.id }}/merged/validation_results.jsonl \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}/merged/mark_analysis

      - name: Evaluate Strict Mark Matcher
        if: inputs.strict_mark_matcher
        run: |
          python scripts/evaluate_strict_mark_matcher.py \
            --input validation/results/${{ steps.run_id.outputs.id }}/merged/validation_results.jsonl \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}/merged/strict_mark_analysis

      - name: Evaluate HQ Mark Calibration
        if: inputs.hq_mark_calibration
        run: |
          python scripts/evaluate_hq_calibration.py \
            --input validation/results/${{ steps.run_id.outputs.id }}/merged/validation_results.jsonl \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}/merged/hq_calibration

      - name: Upload Final Merged Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-results-${{ steps.run_id.outputs.id }}
          path: validation/results/${{ steps.run_id.outputs.id }}/merged/
