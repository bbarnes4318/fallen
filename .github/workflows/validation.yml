name: Biometric Validation Framework

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: 'Path to validation_pairs.csv (for dry-run, full-pipeline, embeddings-only)'
        required: false
        default: 'validation/validation_pairs.example.csv'
      mode:
        description: 'Execution mode'
        required: true
        type: choice
        options:
          - dry-run
          - full-pipeline
          - embeddings-only
          - generate-manifest
          - generate-and-validate-lfw
        default: 'dry-run'
      lfw_pairs_source:
        description: 'Which LFW pairs file to use (for generate-manifest and generate-and-validate-lfw)'
        required: true
        type: choice
        options:
          - full
          - dev-train
          - dev-test
        default: 'full'
      manifest_max_matched:
        description: 'Max matched (same-person) pairs. 0 = unlimited.'
        required: false
        default: '0'
      manifest_max_mismatched:
        description: 'Max mismatched (different-person) pairs. 0 = unlimited.'
        required: false
        default: '0'
      manifest_check_gcs:
        description: 'Verify GCS blob existence during manifest generation'
        required: false
        type: boolean
        default: true
      manifest_fail_on_missing:
        description: 'Fail workflow if any selected LFW image is missing from GCS'
        required: false
        type: boolean
        default: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate Run ID
        id: run_id
        run: echo "id=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT

      - name: Resolve LFW Pairs File
        id: lfw_pairs
        run: |
          case "${{ inputs.lfw_pairs_source }}" in
            full)      PAIRS_FILE="validation/lfw_pairs.txt" ;;
            dev-train) PAIRS_FILE="validation/lfw_pairsDevTrain.txt" ;;
            dev-test)  PAIRS_FILE="validation/lfw_pairsDevTest.txt" ;;
            *)         PAIRS_FILE="validation/lfw_pairs.txt" ;;
          esac
          echo "file=$PAIRS_FILE" >> $GITHUB_OUTPUT
          if [ -f "$PAIRS_FILE" ]; then
            LINES=$(wc -l < "$PAIRS_FILE")
            echo "LFW pairs file: $PAIRS_FILE ($LINES lines)"
          else
            echo "ERROR: LFW pairs file not found: $PAIRS_FILE"
            exit 1
          fi

      # ── GCP Authentication ──
      # Required for: generate-manifest (with GCS check), generate-and-validate-lfw, full-pipeline, embeddings-only
      - name: Authenticate to GCP
        if: >-
          inputs.mode == 'full-pipeline' ||
          inputs.mode == 'embeddings-only' ||
          inputs.mode == 'generate-and-validate-lfw' ||
          (inputs.mode == 'generate-manifest' && inputs.manifest_check_gcs)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}

      # ═══════════════════════════════════════════════════════
      # MODE: dry-run
      # ═══════════════════════════════════════════════════════
      - name: Dry Run — Validate Manifest
        if: inputs.mode == 'dry-run'
        run: |
          python scripts/validate_full_pipeline.py \
            --manifest ${{ inputs.manifest_path }} \
            --output-dir validation/results/${{ steps.run_id.outputs.id }} \
            --dry-run

      # ═══════════════════════════════════════════════════════
      # MODE: generate-manifest
      # ═══════════════════════════════════════════════════════
      - name: Generate LFW Manifest
        if: inputs.mode == 'generate-manifest'
        run: |
          FLAGS=""
          if [ "${{ inputs.manifest_check_gcs }}" = "true" ]; then
            FLAGS="$FLAGS --check-gcs-exists"
          fi
          if [ "${{ inputs.manifest_fail_on_missing }}" = "true" ]; then
            FLAGS="$FLAGS --fail-on-missing"
          fi
          python scripts/generate_lfw_validation_manifest.py \
            --pairs-file "${{ steps.lfw_pairs.outputs.file }}" \
            --gcs-prefix gs://hoppwhistle-facial-uploads/gallery/ \
            --output validation/results/${{ steps.run_id.outputs.id }}/validation_pairs_lfw_baseline.csv \
            --max-matched ${{ inputs.manifest_max_matched }} \
            --max-mismatched ${{ inputs.manifest_max_mismatched }} \
            $FLAGS

      # ═══════════════════════════════════════════════════════
      # MODE: generate-and-validate-lfw
      # ═══════════════════════════════════════════════════════
      - name: Generate LFW Manifest (for validation)
        if: inputs.mode == 'generate-and-validate-lfw'
        run: |
          python scripts/generate_lfw_validation_manifest.py \
            --pairs-file "${{ steps.lfw_pairs.outputs.file }}" \
            --gcs-prefix gs://hoppwhistle-facial-uploads/gallery/ \
            --output validation/results/${{ steps.run_id.outputs.id }}/validation_pairs_lfw_baseline.csv \
            --max-matched ${{ inputs.manifest_max_matched }} \
            --max-mismatched ${{ inputs.manifest_max_mismatched }} \
            --check-gcs-exists \
            --fail-on-missing

      - name: Run Full Pipeline Validation (LFW)
        if: inputs.mode == 'generate-and-validate-lfw'
        env:
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          KMS_KEY_ID: ${{ secrets.KMS_KEY_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
          USE_MARK_PIPELINE_V2: "true"
        run: |
          python scripts/validate_full_pipeline.py \
            --manifest validation/results/${{ steps.run_id.outputs.id }}/validation_pairs_lfw_baseline.csv \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}

      - name: Simulate Decision Policies (LFW)
        if: inputs.mode == 'generate-and-validate-lfw'
        run: |
          python scripts/simulate_decision_policies.py \
            --input validation/results/${{ steps.run_id.outputs.id }}/validation_results.jsonl \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}/policies

      - name: Evaluate Mark LR Correlation (LFW)
        if: inputs.mode == 'generate-and-validate-lfw'
        run: |
          python scripts/evaluate_mark_lr_correlation.py \
            --input validation/results/${{ steps.run_id.outputs.id }}/validation_results.jsonl \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}/mark_analysis

      # ═══════════════════════════════════════════════════════
      # MODE: full-pipeline (with user-provided manifest)
      # ═══════════════════════════════════════════════════════
      - name: Full Pipeline Validation
        if: inputs.mode == 'full-pipeline'
        env:
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          KMS_KEY_ID: ${{ secrets.KMS_KEY_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
          USE_MARK_PIPELINE_V2: "true"
        run: |
          echo "WARNING: Full pipeline validation. This will process real images."
          python scripts/validate_full_pipeline.py \
            --manifest ${{ inputs.manifest_path }} \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}

      # ═══════════════════════════════════════════════════════
      # MODE: embeddings-only
      # ═══════════════════════════════════════════════════════
      - name: Embeddings-Only Validation
        if: inputs.mode == 'embeddings-only'
        env:
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          KMS_KEY_ID: ${{ secrets.KMS_KEY_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
        run: |
          python scripts/validate_embeddings.py \
            --manifest ${{ inputs.manifest_path }} \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}

      # ═══════════════════════════════════════════════════════
      # Post-processing (full-pipeline mode only)
      # ═══════════════════════════════════════════════════════
      - name: Simulate Decision Policies
        if: inputs.mode == 'full-pipeline'
        run: |
          python scripts/simulate_decision_policies.py \
            --input validation/results/${{ steps.run_id.outputs.id }}/validation_results.jsonl \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}/policies

      - name: Evaluate Mark LR Correlation
        if: inputs.mode == 'full-pipeline'
        run: |
          python scripts/evaluate_mark_lr_correlation.py \
            --input validation/results/${{ steps.run_id.outputs.id }}/validation_results.jsonl \
            --output-dir validation/results/${{ steps.run_id.outputs.id }}/mark_analysis

      # ═══════════════════════════════════════════════════════
      # Upload all artifacts
      # ═══════════════════════════════════════════════════════
      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results-${{ steps.run_id.outputs.id }}
          path: validation/results/${{ steps.run_id.outputs.id }}/
